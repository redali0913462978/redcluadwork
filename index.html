<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks — To-Do List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<style>
:root{
  --bg:#f4f5fb; --card:#fff; --text:#1f2340; --muted:#8a8fa8; --line:#eceef6;
  --accent:#5b5bf0; --accent2:#8b5cf6; --danger:#ef4444; --ok:#22c55e;
  --shadow:0 20px 50px -20px rgba(60,60,140,.25);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1120; --card:#181b31; --text:#eceefb; --muted:#7d83a3; --line:#262a47;
  --shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; justify-content:center; padding:48px 16px;
  background-image:radial-gradient(circle at 15% 0%,rgba(91,91,240,.18),transparent 40%),
                   radial-gradient(circle at 90% 10%,rgba(139,92,246,.15),transparent 35%);
  transition:background .3s,color .3s;
}
.app{width:100%;max-width:560px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em}
.date{color:var(--muted);font-size:.9rem;margin-top:4px}
.icon-btn{
  border:1px solid var(--line);background:var(--card);color:var(--text);
  width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:1.1rem;
  box-shadow:var(--shadow);transition:transform .15s;
}
.icon-btn:hover{transform:translateY(-2px)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.progress{padding:20px 24px 0}
.progress-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s ease}
form{display:flex;gap:10px;padding:20px 24px}
input[type=text]{
  flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);
  padding:14px 16px;border-radius:12px;font:inherit;outline:none;transition:border .2s,box-shadow .2s;
}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,91,240,.15)}
.add{
  border:0;color:#fff;font:inherit;font-weight:600;padding:0 22px;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .15s,filter .15s;
}
.add:hover{filter:brightness(1.08);transform:translateY(-1px)}
.filters{display:flex;gap:6px;padding:0 24px 12px}
.filters button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;font-weight:600;
  padding:7px 14px;border-radius:99px;cursor:pointer;transition:.2s;
}
.filters button.active{background:rgba(91,91,240,.12);color:var(--accent)}
ul{list-style:none;padding:0}
li{
  display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--line);
  animation:in .25s ease; transition:background .2s;
}
li:hover{background:rgba(127,127,170,.06)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.check{
  appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;
  cursor:pointer;flex-shrink:0;display:grid;place-content:center;transition:.2s;background:transparent;
}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"✓";color:#fff;font-size:13px;font-weight:700}
.label{flex:1;word-break:break-word;cursor:text;line-height:1.4}
li.done .label{text-decoration:line-through;color:var(--muted)}
.edit{flex:1;font:inherit;border:0;border-bottom:2px solid var(--accent);background:transparent;color:var(--text);outline:none;padding:2px 0}
.del{
  border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem;
  opacity:0;transition:.2s;border-radius:8px;width:30px;height:30px;
}
li:hover .del,.del:focus{opacity:1}
.del:hover{color:var(--danger);background:rgba(239,68,68,.1)}
@media(hover:none){.del{opacity:1}}
.empty{text-align:center;color:var(--muted);padding:40px 24px;border-top:1px solid var(--line)}
.empty .big{font-size:2.2rem;margin-bottom:6px}
footer{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
footer button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}
footer button:hover{color:var(--danger)}
.hint{text-align:center;color:var(--muted);font-size:.78rem;margin-top:16px}
.delivery{margin-top:24px;padding:22px 24px 0;overflow:hidden}
.delivery h2{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.delivery p{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.scene{display:block;width:calc(100% + 48px);margin:0 -24px;height:auto}
.sky{fill:var(--bg)}
.road{fill:#4a4f66}.lane{stroke:#e8e9f3;stroke-width:3;stroke-dasharray:14 12}
.store{opacity:.45;transition:opacity .4s}.store.open{opacity:1}
.store text{font:700 10px var(--font);fill:#fff;text-anchor:middle}
#car{transform:translateX(4px);transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.strength{margin-top:24px;padding:22px 24px;display:flex;align-items:center;gap:22px}
.strength svg{width:120px;height:auto;flex-shrink:0;overflow:visible}
.strength h2{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.strength .lvl{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.strength p{color:var(--muted);font-size:.85rem;line-height:1.4}
.pose{transition:all .4s}
@media(max-width:420px){.strength{flex-direction:column;text-align:center}}
.medals{margin-top:24px;padding:22px 24px}
.medals h2{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.medals p{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.medal-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.medal{text-align:center;transition:transform .2s}
.medal svg{width:100%;max-width:84px;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));transition:.3s}
.medal.locked svg{filter:grayscale(1) opacity(.35)}
.medal:not(.locked):hover{transform:translateY(-4px) rotate(-2deg)}
.medal b{display:block;font-size:.8rem;margin-top:6px}
.medal small{color:var(--muted);font-size:.72rem}
@media(max-width:420px){.medal-list{grid-template-columns:repeat(2,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 0 16px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.store text.sign{fill:var(--text)}
.car{transition:transform 1s cubic-bezier(.4,.1,.2,1)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>My Tasks</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle theme">🌙</button>
  </header>

  <main class="card">
    <div class="progress">
      <div class="progress-top"><span id="progressText">No tasks yet</span><span id="percent">0%</span></div>
      <div class="bar"><span id="barFill"></span></div>
    </div>

    <form id="form">
      <input type="text" id="input" placeholder="What needs to be done?" maxlength="200" autocomplete="off" aria-label="New task">
      <button class="add" type="submit">Add</button>
    </form>

    <nav class="filters" id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="active">Active</button>
      <button data-f="done">Completed</button>
    </nav>

    <ul id="list"></ul>

    <footer>
      <span id="count">0 items left</span>
      <button id="clear">Clear completed</button>
    </footer>
  </main>

  <section class="delivery card">
    <h2>Metal delivery run</h2>
    <p id="deliveryText">Add tasks to load up the trucks.</p>
    <svg class="scene" id="scene" viewBox="0 0 640 240" role="img" aria-label="Delivery cars carrying metal products past five metal stores"></svg>
    <div class="legend" id="legend"></div>
  </section>

  <section class="strength card" id="strength"></section>

  <section class="medals card">
    <h2>Medals</h2>
    <p>Complete tasks to unlock them.</p>
    <div class="medal-list" id="medals"></div>
  </section>
  <p class="hint">Double-click a task to edit it · Your tasks are saved in this browser</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'todo-app-v1', THEME = 'todo-theme';
  let todos = [], filter = 'all';

  const load = () => { try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch { todos = []; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} };

  function render() {
    const list = $('list');
    const shown = todos.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));
    list.innerHTML = '';
    shown.forEach(t => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'check'; cb.checked = t.done;
      cb.setAttribute('aria-label', 'Mark complete');
      cb.onchange = () => { t.done = cb.checked; save(); render(); };

      const label = document.createElement('span');
      label.className = 'label'; label.textContent = t.text;
      label.ondblclick = () => startEdit(t, label);

      const del = document.createElement('button');
      del.className = 'del'; del.innerHTML = '&times;'; del.setAttribute('aria-label', 'Delete task');
      del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };

      li.append(cb, label, del);
      list.appendChild(li);
    });

    if (!shown.length) {
      const msgs = { all: ['🎉', 'Nothing here yet. Add your first task!'],
                     active: ['✨', 'All caught up!'], done: ['📝', 'No completed tasks yet.'] };
      const e = document.createElement('li');
      e.className = 'empty'; e.style.display = 'block';
      e.innerHTML = `<div class="big">${msgs[filter][0]}</div>${msgs[filter][1]}`;
      list.appendChild(e);
    }

    const total = todos.length, done = todos.filter(t => t.done).length, left = total - done;
    const pct = total ? Math.round(done / total * 100) : 0;
    $('count').textContent = `${left} item${left === 1 ? '' : 's'} left`;
    $('progressText').textContent = total ? `${done} of ${total} completed` : 'No tasks yet';
    $('percent').textContent = pct + '%';
    $('barFill').style.width = pct + '%';
    $('clear').style.visibility = done ? 'visible' : 'hidden';
    renderMedals(done);
    renderCar(done, total, pct);
  }

  function renderCar(done, total, pct) {
    CARS.forEach((c, i) => {
      const p = Math.pow(pct / 100, c.p);
      $('car' + i).style.transform = `translate(${6 + p * 579}px, ${c.lane - 56.5}px) scale(.5)`;
    });
    const open = STORES.filter((_, i) => total > 0 && pct >= (i + 1) * 20);
    STORES.forEach((_, i) => $('store' + i).classList.toggle('open', total > 0 && pct >= (i + 1) * 20));
    $('deliveryText').textContent = !total ? 'Add tasks to load up the trucks.'
      : pct === 100 ? 'All deliveries made! Every metal store is open 🎉'
      : `${done} of ${total} tasks delivered · ${open.length} of ${STORES.length} stores open`;
  }

  const STORES = [
    { n: 'Steel',    c: '#5c6b80', d: '#3f4b5c', h: 62 },
    { n: 'Copper',   c: '#c8693a', d: '#964a24', h: 52 },
    { n: 'Aluminum', c: '#8fa6bd', d: '#6a8099', h: 66 },
    { n: 'Iron',     c: '#4d5263', d: '#343846', h: 56 },
    { n: 'Brass',    c: '#d9a520', d: '#a87b0c', h: 60 }
  ];
  const CARS = [
    { c: '#5b5bf0', lane: 172, p: 1,   cargo: 'Copper pipes',   art: [34,46,58].map(x => `<circle cx="${x}" cy="52" r="6" fill="#c8693a" stroke="#964a24"/>`).join('') + [40,52].map(x => `<circle cx="${x}" cy="40" r="6" fill="#c8693a" stroke="#964a24"/>`).join('') },
    { c: '#22a06b', lane: 200, p: .75, cargo: 'Steel beams',    art: '<rect x="24" y="46" width="50" height="7" fill="#7f8da0"/><rect x="26" y="37" width="46" height="7" fill="#9aa8ba"/><rect x="30" y="28" width="38" height="7" fill="#b3bfce"/>' },
    { c: '#e0457b', lane: 228, p: 1.4,  cargo: 'Aluminum sheets', art: '<rect x="26" y="44" width="46" height="14" fill="#c9d6e3" stroke="#8fa6bd"/><rect x="30" y="34" width="38" height="10" fill="#dde7f0" stroke="#8fa6bd"/><rect x="34" y="26" width="30" height="8" fill="#eef3f8" stroke="#8fa6bd"/>' }
  ];

  function buildScene() {
    let g = '<rect class="sky" width="640" height="240"/>';
    STORES.forEach((s, i) => {
      const x = 20 + i * 122, top = 130 - s.h;
      g += `<g class="store" id="store${i}">
        <rect x="${x}" y="${top}" width="104" height="${s.h}" fill="${s.c}"/>
        <rect x="${x}" y="${top}" width="104" height="10" fill="${s.d}"/>
        <rect x="${x + 10}" y="100" width="22" height="30" fill="#fff" opacity=".85"/>
        <rect x="${x + 44}" y="${top + 20}" width="48" height="20" fill="#fff" opacity=".3"/>
        <rect x="${x + 50}" y="${top + 28}" width="16" height="8" fill="#fff" opacity=".7"/><rect x="${x + 70}" y="${top + 28}" width="16" height="8" fill="#fff" opacity=".7"/>
        <text class="sign" x="${x + 52}" y="${top - 5}">${s.n}</text></g>`;
    });
    g += '<rect class="road" y="130" width="640" height="110"/><line class="lane" x1="0" y1="186" x2="640" y2="186"/><line class="lane" x1="0" y1="214" x2="640" y2="214"/>';
    CARS.forEach((c, i) => {
      g += `<g class="car" id="car${i}">${c.art}
        <path d="M2,92 Q2,78 16,76 L24,58 H70 L84,76 Q98,78 98,92 V102 H2Z" fill="${c.c}"/>
        <path d="M30,62 H46 V76 H24Z M50,62 H66 L76,76 H50Z" fill="#cfe8ff"/>
        <rect x="92" y="84" width="6" height="7" rx="2" fill="#ffe066"/>
        <circle cx="26" cy="102" r="11" fill="#1f2340"/><circle cx="26" cy="102" r="4.5" fill="#bfc3d9"/>
        <circle cx="76" cy="102" r="11" fill="#1f2340"/><circle cx="76" cy="102" r="4.5" fill="#bfc3d9"/></g>`;
    });
    $('scene').innerHTML = g;
    $('legend').innerHTML = CARS.map(c => `<span><i style="background:${c.c}"></i>${c.cargo}</span>`).join('');
  }

  const MEDALS = [
    { name: 'Bronze',   need: 1,  c: ['#f0b27a', '#cd7f32', '#8a4f1d'] },
    { name: 'Silver',   need: 5,  c: ['#ffffff', '#c0c4cc', '#7b818c'] },
    { name: 'Gold',     need: 10, c: ['#fff3a6', '#f5c518', '#b8860b'] },
    { name: 'Platinum', need: 20, c: ['#f4fbff', '#9fd3ee', '#4f8fb0'] }
  ];
  const LEVELS = [
    { need: 0,  name: 'Warming up',  color: '#8a8fa8', msg: 'Complete your first task to start building mental strength.' },
    { need: 1,  name: 'Getting started', color: '#cd7f32', msg: 'You are standing tall. Keep the momentum going!' },
    { need: 5,  name: 'Strong',      color: '#5b5bf0', msg: 'Your discipline is showing. Keep flexing that focus!' },
    { need: 10, name: 'Powerful',    color: '#f5a60b', msg: 'Unstoppable habits. You are a force to reckon with.' },
    { need: 20, name: 'Unstoppable', color: '#8b5cf6', msg: 'Champion level. Total mental strength achieved!' }
  ];
  const ARMS = [
    ['M46,58 L38,80 L40,98', 'M74,58 L82,80 L80,98'],
    ['M46,58 L36,80 L34,98', 'M74,58 L84,80 L86,98'],
    ['M46,58 L26,64 L28,42', 'M74,58 L94,64 L92,42'],
    ['M46,58 L26,64 L28,42', 'M74,58 L94,64 L92,42'],
    ['M46,58 L30,40 L24,20', 'M74,58 L90,40 L96,20']
  ];
  function figureSVG(lv) {
    const c = LEVELS[lv].color, a = ARMS[lv], hy = lv === 0 ? 34 : 28;
    const limb = `fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"`;
    return `<svg viewBox="0 0 120 140" role="img" aria-label="Person showing ${LEVELS[lv].name} mental strength">
      ${lv >= 3 ? `<circle cx="60" cy="72" r="62" fill="${c}" opacity=".14"/><circle cx="60" cy="72" r="48" fill="${c}" opacity=".12"/>` : ''}
      <g class="pose">
        <path d="M60,48 L60,90" ${limb} stroke-width="16"/>
        <path d="M60,90 L48,128" ${limb}/><path d="M60,90 L72,128" ${limb}/>
        <path d="${a[0]}" ${limb}/><path d="${a[1]}" ${limb}/>
        <circle cx="60" cy="${hy}" r="15" fill="#f1c9a5"/>
        <path d="M45,${hy - 2} Q60,${hy - 22} 75,${hy - 2} Q60,${hy - 10} 45,${hy - 2}Z" fill="#3b2f2f"/>
        <circle cx="55" cy="${hy + 2}" r="1.6" fill="#3b2f2f"/><circle cx="65" cy="${hy + 2}" r="1.6" fill="#3b2f2f"/>
        <path d="${lv === 0 ? `M55,${hy + 9} Q60,${hy + 6} 65,${hy + 9}` : `M54,${hy + 7} Q60,${hy + 13} 66,${hy + 7}`}" fill="none" stroke="#3b2f2f" stroke-width="1.8" stroke-linecap="round"/>
        ${lv === 4 ? `<polygon points="60,-14 64,-4 75,-3 67,4 69,15 60,9 51,15 53,4 45,-3 56,-4" fill="#f5c518"/>` : ''}
      </g></svg>`;
  }
  function renderStrength(best) {
    let lv = 0; LEVELS.forEach((l, i) => { if (best >= l.need) lv = i; });
    const next = LEVELS[lv + 1];
    $('strength').innerHTML = `${figureSVG(lv)}<div><h2>Mental strength</h2>
      <div class="lvl" style="color:${LEVELS[lv].color}">${LEVELS[lv].name}</div>
      <p>${LEVELS[lv].msg}${next ? ` Next level: ${next.need - best} more task${next.need - best > 1 ? 's' : ''}.` : ''}</p></div>`;
  }
  const BEST = 'todo-best';
  const medalSVG = (m, i) => `
    <svg viewBox="0 0 100 120" role="img" aria-label="${m.name} medal">
      <defs>
        <radialGradient id="mg${i}" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="${m.c[0]}"/><stop offset=".55" stop-color="${m.c[1]}"/><stop offset="1" stop-color="${m.c[2]}"/>
        </radialGradient>
      </defs>
      <polygon points="28,0 50,0 58,46 38,46" fill="#5b5bf0"/>
      <polygon points="72,0 50,0 42,46 62,46" fill="#8b5cf6"/>
      <circle cx="50" cy="76" r="38" fill="url(#mg${i})" stroke="${m.c[2]}" stroke-width="2"/>
      <circle cx="50" cy="76" r="29" fill="none" stroke="${m.c[2]}" stroke-opacity=".5" stroke-width="2"/>
      <polygon points="50,56 55.9,69.5 70.5,70.8 59.4,80.4 62.8,94.7 50,87 37.2,94.7 40.6,80.4 29.5,70.8 44.1,69.5" fill="${m.c[0]}" stroke="${m.c[2]}" stroke-width="1.5"/>
    </svg>`;

  function renderMedals(done) {
    let best = 0; try { best = +localStorage.getItem(BEST) || 0; } catch {}
    if (done > best) { best = done; try { localStorage.setItem(BEST, best); } catch {} }
    renderStrength(best);
    $('medals').innerHTML = MEDALS.map((m, i) =>
      `<div class="medal ${best >= m.need ? '' : 'locked'}">${medalSVG(m, i)}<b>${m.name}</b><small>${m.need} task${m.need > 1 ? 's' : ''} done</small></div>`
    ).join('');
  }

  function startEdit(t, label) {
    const inp = document.createElement('input');
    inp.className = 'edit'; inp.value = t.text; inp.maxLength = 200;
    label.replaceWith(inp); inp.focus(); inp.select();
    let finished = false;
    const finish = commit => {
      if (finished) return; finished = true;
      const v = inp.value.trim();
      if (commit && v) t.text = v;
      save(); render();
    };
    inp.onblur = () => finish(true);
    inp.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  }

  $('form').onsubmit = e => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now() + Math.random(), text, done: false });
    $('input').value = '';
    save(); render();
  };

  $('filters').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
    render();
  };

  $('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $('theme').textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(THEME, t); } catch {}
  }
  $('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  let saved = null; try { saved = localStorage.getItem(THEME); } catch {}
  setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  buildScene(); load(); render();
})();
</script>
